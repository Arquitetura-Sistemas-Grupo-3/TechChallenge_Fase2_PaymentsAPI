apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
      - name: payments-api
        image: julianamh/webapipagamento:1.2
        ports:
        - containerPort: 8080
        envFrom:
          - configMapRef:
              name: payment-api-configmap
          - secretRef:
              name: payment-api-secret